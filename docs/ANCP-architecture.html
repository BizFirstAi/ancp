  <style>
    body { overflow-x: hidden; }
    .ancp-arch-layout {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
    }

    .ancp-arch-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--b-space-3) var(--b-space-8);
      border-bottom: 1px solid var(--b-border-subtle);
      background: var(--b-card-bg);
      flex-shrink: 0;
    }

    .ancp-arch-toolbar__title {
      font-size: var(--b-font-size-sm);
      font-weight: var(--b-font-weight-semibold);
      color: var(--b-text-primary);
    }

    .ancp-arch-toolbar__subtitle {
      font-size: var(--b-font-size-xs);
      color: var(--b-text-muted);
      margin-left: var(--b-space-3);
    }

    .ancp-arch-toolbar__left {
      display: flex;
      align-items: center;
    }

    .ancp-arch-toolbar__actions {
      display: flex;
      gap: var(--b-space-3);
    }

    .ancp-arch-frame {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      box-shadow: none;
      display: block;
    }

    @media (max-width: 768px) {
      .ancp-arch-toolbar {
        padding: var(--b-space-3) var(--b-space-4);
      }

      .ancp-arch-toolbar__subtitle {
        display: none;
      }
    }
  </style>
</head>
